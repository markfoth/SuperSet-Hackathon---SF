  source_url: https://data.sf.gov/d/ygmz-vaxd; https://gis.smcgov.org/maps/rest/services/Common/SanMateoCounty_Basemap/MapServer/17
  licence: 'SF: ODC PDDL; public San Mateo County GIS (see peninsula_cycling)'
  downloaded_at: '2026-10-21'
  measurement_period: Network as of download date
  resolution: Street segment (block-level line geometry)
  feature_count: 5545
  raw_path: data/sf/raw/bike_network.geojson; data/sf/raw/peninsula_cycling.geojson
  processed_path:
  - data/sf/processed/cycling_network.geojson
  script: scripts/process_datasets.py
  refresh: quarterly
  limitations: 'County Peninsula facilities require Existing status; proposed/unknown-status facilities
    are omitted. Source update dates differ. One feature per direction where facilities differ, so km
    totals count each side. Category counts: lane 1757, neighborway 121, path 378, protected 678, route
    2611. grade_pct is a terrain estimate, not a surveyed street grade.'
  status: processed
  regional_extension: See regional_study; build_region.py and regional context builders extend coverage
    without extrapolating municipal measurements
daily_essentials:
  source: OpenStreetMap contributors
  source_url: https://overpass-api.de/api/interpreter
  licence: ODbL 1.0; https://www.openstreetmap.org/copyright
  downloaded_at: '2026-11-13'
  measurement_period: '2026-11-13T07:36:31Z'
  resolution: Mapped points or polygon centres, WGS84; distance in metres
  feature_count: 1372
  raw_path: data/sf/raw/regional
  processed_path:
  - data/sf/processed/daily_essentials.json
  script: scripts/build_decision_context.py
  refresh: python scripts/build_decision_context.py --refresh
  limitations: Volunteer mapping is incomplete. Park entrances are tagged nodes on mapped park boundaries,
    not surveyed accessible routes. Park points are polygon centres, not access points. Opening hours
    and accessibility may be missing. Proximity is not network walking time.
  status: processed
elevation:
  source: USGS 3DEP bare-earth DEM + official SF DPW and San Mateo County street centrelines
  source_url: https://data.sf.gov/d/3psu-pn9h; https://gis.smcgov.org/maps/rest/services/Common/SanMateoCounty_Basemap/MapServer/26;
    https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer
  licence: USGS US public domain; DataSF ODC PDDL; public San Mateo County GIS (see peninsula_streets)
  downloaded_at: '2026-10-22'
  measurement_period: Street snapshot at download; DEM composite of lidar acquisitions
  resolution: Street centrelines sampled every ~10 m; 40 m rolling windows; length-weighted H3-9 aggregates
  feature_count: 2408
  raw_path: data/sf/raw/streets_active.geojson; data/sf/raw/peninsula_streets.geojson; data/sf/raw/elevation_3dep_10m.tif
  processed_path:
  - data/sf/processed/hills_grid.geojson
  - data/sf/processed/cycling_network.geojson (grade_pct)
  script: scripts/street_gradients.py via process_datasets.py --only hills
  refresh: after street or DEM refresh
  limitations: 'DEM-derived street-gradient estimates, not surveyed. Bare-earth DEM cannot resolve bridge
    decks, tunnels, retaining walls or stairs. No windows on roads <40 m. Null cell grade below 100 m
    valid street length or 75% coverage. Median may hide a steep street: p90 and steep-length share are
    retained. No neighbourhood terrain mean used.'
  status: processed
  regional_extension: See regional_study; build_region.py and regional context builders extend coverage
    without extrapolating municipal measurements
flood_context:
  source: FEMA National Flood Hazard Layer
  source_url: https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/28
  licence: US government works; publisher licence record https://catalog.data.gov/dataset/national-flood-hazard-layer
    points to https://www.usa.gov/government-works; attribute FEMA
  downloaded_at: '2026-11-13'
  measurement_period: Effective FIRM polygons as served on download date; effective dates vary by panel
  resolution: FIRM zone polygons, simplified approximately 3 m; original categories retained
  feature_count: 546
  raw_path: data/sf/raw/regional
  processed_path:
  - data/sf/processed/flood_context.json
  script: scripts/build_decision_context.py
  refresh: python scripts/build_decision_context.py --refresh
  limitations: Context only, not an address-level flood determination or insurance advice. Absence of
    a mapped zone does not mean no flood exposure. No hazard is a ranking input.
  status: processed
