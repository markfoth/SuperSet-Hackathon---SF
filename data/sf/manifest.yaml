  source_url: n/a (derived)
  licence: Inherits the most restrictive input (Zillow terms for the rents block)
  downloaded_at: '2026-10-22'
  measurement_period: Per input dataset
  resolution: 58 SF neighbourhood / Peninsula jurisdiction groups, computed from finer inputs
  feature_count: 58
  raw_path: n/a
  processed_path:
  - data/sf/processed/neighbourhood_metrics.json
  script: scripts/process_datasets.py
  refresh: after any input rebuild
  limitations: 'Coverage (groups with data): crime 41/58, parks 58/58, cycling 58/58, transit 58/58, hills
    58/58, groceries 58/58, collisions 41/58, rents 58/58, population 58/58, environment 58/58, food_drink
    58/58'
  status: processed
neighbourhoods:
  source: DataSF Analysis Neighborhoods + San Mateo County GIS jurisdictions, ocean/bay and lakes
  source_url: https://data.sf.gov/d/j2bu-swwd; https://gis.smcgov.org/maps/rest/services/ODP/Jurisdictions/FeatureServer/0;
    see peninsula_water / peninsula_lakes
  licence: 'SF: ODC PDDL; public San Mateo County GIS (no explicit redistribution licence in REST metadata)'
  downloaded_at: '2026-10-21'
  measurement_period: Boundaries as published (last updated 2023-10)
  resolution: 41 SF analysis neighbourhoods + 17 Peninsula city/unincorporated groups
  feature_count: 58
  raw_path: data/sf/raw/neighbourhoods.geojson; peninsula_jurisdictions.geojson; peninsula_water.geojson;
    peninsula_lakes.geojson
  processed_path:
  - data/sf/processed/neighbourhoods.geojson
  - data/sf/processed/neighbourhood_samples.json
  script: scripts/process_datasets.py
  refresh: yearly
  limitations: SF uses planning analysis boundaries; Peninsula groups use county city/unincorporated boundaries,
    not neighbourhood boundaries. Clipped at 37.60 N (SFO southern edge); bay/ocean/lakes removed. Geometry
    simplified at 5 m. `id` is a slug of the name and is the stable key used by every other dataset; renaming
    a neighbourhood changes it.
  status: processed
parks:
  source: SF Rec & Park + San Mateo County GIS parks; supplemented by OpenStreetMap
  source_url: https://data.sf.gov/d/gtr9-ntp6; https://gis.smcgov.org/maps/rest/services/Common/SanMateoCounty_Basemap/MapServer/37;
    https://www.openstreetmap.org (Overpass API)
  licence: 'RPD: ODC PDDL. County: public GIS (see peninsula_parks). OSM: ODbL 1.0 — © OpenStreetMap contributors'
  downloaded_at: '2026-10-21'
  measurement_period: Properties as of download date
  resolution: Park polygons; neighbourhood access shares from H3 res-9 sample points
  feature_count: 376
  raw_path: data/sf/raw/parks_rpd.geojson; data/sf/raw/peninsula_parks.geojson; data/sf/raw/osm_parks.json
  processed_path:
  - data/sf/processed/parks.geojson
  script: scripts/process_datasets.py
  refresh: yearly
  limitations: RPD covers only city-owned parks; federal (Presidio, GGNRA) and state land comes from OSM.
    71 non-RPD parks added from OpenStreetMap (ODbL), e.g. Presidio of San Francisco, San Francisco Peninsula
    Watershed, Fort Funston, Candlestick Point State Recreation Area, Lands End, Mussel Rock City Park.
    Non-park RPD property types (libraries, concessions, Camp Mather, Sharp Park outside SF) are excluded.
    Access uses straight-line distance, not walking routes.
  status: processed
