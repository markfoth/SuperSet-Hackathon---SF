  refresh: as needed
  limitations: 48/58 groups have a photo; 48 cached locally (4378 KB, max 800 px). Descriptions are drafts
    and avoid demographic claims. Photos are mostly Wikipedia lead images (3 hand-picked); some show a
    landmark rather than streets.
  status: processed
