police_incidents:
  source: 'DataSF — Police Department Incident Reports: 2018 to Present (SFPD)'
  source_url: https://data.sf.gov/d/wg3w-h783
  licence: ODC Public Domain Dedication and License (PDDL)
  downloaded_at: '2026-10-21'
  measurement_period: '2025-10-01 to 2026-10-01 (exclusive): 12 complete months'
  resolution: Incident points anonymised to intersection/block; published as neighbourhood totals and
    H3 res-8 cells
  feature_count: 170
  raw_path: data/sf/raw/police_incidents_12m.json
  processed_path:
  - data/sf/processed/crime_by_neighbourhood.json
  - data/sf/processed/crime_grid.geojson
  script: scripts/process_datasets.py
  refresh: monthly
  limitations: 'Reported incidents only — not all crime is reported, and reporting rates differ by place
    and type. Per-km² rates are not per-resident: commercial and visitor areas (Downtown, Tenderloin,
    Financial District) have high daytime populations that inflate them. Drug offences largely reflect
    enforcement activity rather than resident risk. SFPD anonymises locations to the nearest intersection
    or block; points are not addresses. This describes reported incidents; it does not make any area safe
    or unsafe. 1708 incidents could not be placed in a neighbourhood.'
  status: processed
  incidents_counted: 49515
rents_zori:
  source: Zillow Research — ZORI (ZIP, all homes, smoothed, monthly); ZIP geography from Census 2020 ZCTAs
  source_url: https://www.zillow.com/research/data/ ; TIGERweb ZCTA 2020
  licence: 'Zillow Research data terms — free with attribution; REDISTRIBUTION OF DERIVED DATA UNRESOLVED,
    review https://www.zillow.com/research/data/ terms before public deployment. ZCTA: public domain.'
  downloaded_at: '2026-10-21'
  measurement_period: 2015-01 to 2026-09 monthly
  resolution: ZIP code (ZCTA approximation); NOT neighbourhood-specific
  feature_count: 34
  raw_path: data/sf/raw/zillow_zori_zip.csv, data/sf/raw/zcta_2020.geojson
  processed_path:
  - data/sf/processed/rents_zori_zip.json
  script: scripts/process_datasets.py
  refresh: monthly
  limitations: Asking rents for listed units, skewed toward units that turn over. ZIPs cross neighbourhood
    boundaries; the neighbourhood figure is a blend and must be labelled as ZIP-level. ZIPs with too few
    listings have no ZORI series.
  status: processed
street_gradients:
  source: USGS 3DEP bare-earth DEM + official SF DPW and San Mateo County street centrelines
  source_url: https://data.sf.gov/d/3psu-pn9h; https://gis.smcgov.org/maps/rest/services/Common/SanMateoCounty_Basemap/MapServer/26;
    https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer
  licence: USGS US public domain; DataSF ODC PDDL; public San Mateo County GIS (see peninsula_streets)
  downloaded_at: '2026-10-22'
  measurement_period: Street snapshot at download; DEM composite of lidar acquisitions
  resolution: Street centrelines sampled every ~10 m; 40 m rolling windows; length-weighted H3-9 aggregates
  feature_count: 14585
  raw_path: data/sf/raw/streets_active.geojson; data/sf/raw/peninsula_streets.geojson; data/sf/raw/elevation_3dep_10m.tif
  processed_path:
  - data/sf/processed/street_gradients.geojson
  - data/sf/processed/street_gradient_validation.json
  script: scripts/street_gradients.py via process_datasets.py --only hills
  refresh: after street or DEM refresh
  limitations: 'DEM-derived street-gradient estimates, not surveyed. Bare-earth DEM cannot resolve bridge
    decks, tunnels, retaining walls or stairs. No windows on roads <40 m. Null cell grade below 100 m
    valid street length or 75% coverage. Median may hide a steep street: p90 and steep-length share are
    retained. No neighbourhood terrain mean used.'
  status: processed
street_gradients_peninsula:
  source: USGS 3DEP bare-earth DEM + official SF DPW and San Mateo County street centrelines
  source_url: https://data.sf.gov/d/3psu-pn9h; https://gis.smcgov.org/maps/rest/services/Common/SanMateoCounty_Basemap/MapServer/26;
    https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer
  licence: USGS US public domain; DataSF ODC PDDL; public San Mateo County GIS (see peninsula_streets)
  downloaded_at: '2026-10-22'
  measurement_period: Street snapshot at download; DEM composite of lidar acquisitions
  resolution: Street centrelines sampled every ~10 m; 40 m rolling windows; length-weighted H3-9 aggregates
  feature_count: 6337
  raw_path: data/sf/raw/streets_active.geojson; data/sf/raw/peninsula_streets.geojson; data/sf/raw/elevation_3dep_10m.tif
  processed_path:
  - data/sf/processed/street_gradients_peninsula.geojson
  script: scripts/street_gradients.py via process_datasets.py --only hills
  refresh: after street or DEM refresh
  limitations: 'DEM-derived street-gradient estimates, not surveyed. Bare-earth DEM cannot resolve bridge
    decks, tunnels, retaining walls or stairs. No windows on roads <40 m. Null cell grade below 100 m
    valid street length or 75% coverage. Median may hide a steep street: p90 and steep-length share are
    retained. No neighbourhood terrain mean used.'
  status: processed
topography:
  source: USGS 3DEP bare-earth elevation; study land from SF and San Mateo County boundaries
  source_url: https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer
  licence: 'Elevation: US public domain (USGS); land mask inherits boundary sources'
  downloaded_at: '2026-10-22'
  measurement_period: DEM composite of source lidar acquisitions
  resolution: Approximately 10 m source DEM, resampled to 30 m Web Mercator display pixels
  feature_count: null
  raw_path: data/sf/raw/elevation_3dep_10m.tif; peninsula_water.geojson; peninsula_lakes.geojson
  processed_path:
  - data/sf/processed/topography.json
  - data/sf/processed/topography.png
  script: scripts/build_topography.py via process_datasets.py --only topography
  refresh: after DEM or study-area boundary changes
  limitations: Bare-earth elevations, not surveyed road gradients or building heights. Colours express
    elevation above sea level, not slope. Shoreline and vertical accuracy inherit the source data; no
    coverage outside the study land.
  status: processed
transit:
  source: Combined BART + Muni + Caltrain + SamTrans static GTFS
  source_url: see gtfs_* entries
  licence: Per-feed (see gtfs_* entries); SFMTA notice required on the map attribution
  downloaded_at: '2026-10-22'
  measurement_period: Representative weekday per feed
  resolution: Stops (rail rolled up to parent stations) and one representative shape per route
  feature_count: 3981
  raw_path: data/sf/raw/gtfs_*.zip
  processed_path:
  - data/sf/processed/transit_stops.geojson
  - data/sf/processed/transit_routes.geojson
  script: scripts/process_datasets.py
  refresh: quarterly
  limitations: 3981 stops, 112 routes inside the study area. weekday_departures counts all trips serving
    the stop on the representative day. 'Frequent' = >=120 weekday departures. SamTrans included from
    its official public feed. Not a routing engine.
  status: processed
  route_count: 112
