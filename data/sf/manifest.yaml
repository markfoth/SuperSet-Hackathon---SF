# Common Ground data manifest — San Francisco + northern Peninsula.
#
# One entry per dataset. Builders update their own entry via
# scripts/_common.py:update_manifest(); tests/test_data.py checks that every
# processed file referenced here exists and that its feature_count matches.
#
# Fields: source, source_url, licence, downloaded_at, measurement_period,
# resolution, feature_count, raw_path, processed_path (list), script,
# refresh, limitations, status (processed | downloaded | blocked | deferred).

acs_tracts:
  source: US Census Bureau — ACS 2020-2024 5-year table-based summary files (B01003, B25064); 2020 tract
    geometry from TIGERweb
  source_url: https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/
  licence: US public domain (Census Bureau)
  downloaded_at: '2026-10-21'
  measurement_period: 2020-2024 (5-year estimates)
  resolution: Census tract (2020 boundaries); neighbourhood totals by land-area apportionment
  feature_count: 310
  raw_path: data/sf/raw/acs5y2024_b01003.dat, acs5y2024_b25064.dat, census_tracts_2020.geojson
  processed_path:
  - data/sf/processed/census_tracts.geojson
  script: scripts/process_datasets.py
  refresh: yearly (December ACS release)
  limitations: Estimates with margins of error (kept as *_moe). Neighbourhood population (SF total 830,311)
    assumes residents are spread evenly across each tract's land. Median gross rent is rent PAID by current
    tenants (incl. long-standing rent-controlled leases), not asking rent. The Census API needs a key;
    these official bulk files do not.
  status: processed
area_cells:
  source: Derived from H3 and DataSF Analysis Neighborhoods; contextual inputs recorded separately
  source_url: https://data.sf.gov/d/j2bu-swwd
  licence: Inherits inputs; H3 Apache-2.0
  downloaded_at: '2026-10-22'
  measurement_period: Per input dataset
  resolution: H3 resolution 9 (~0.105 km²); coarser indicators retain original source ids
  feature_count: 1226
  raw_path: See individual source entries
  processed_path:
  - data/sf/processed/area_cells.geojson
  script: scripts/build_area_cells.py
  refresh: after rebuilding any input
  limitations: Centre-based access and commute checks describe a representative location, not every address.
    Parent assignment is approximate along neighbourhood borders. Land use is incomplete.
  status: processed
calenviroscreen5:
  source: OEHHA CalEnviroScreen 5.0 (final), California Open Data Portal
  source_url: https://data.ca.gov/dataset/calenviroscreen-5-0
  licence: Unresolved on the portal ('License not specified'); California public agency data — attribute
    OEHHA
  downloaded_at: '2026-10-21'
  measurement_period: Indicator-specific (mostly 2019-2024); release dated 2026-07-01
  resolution: Census tract (2020 boundaries; outlines clipped to the study area, values whole-tract)
  feature_count: 310
  raw_path: data/sf/raw/calenviroscreen50_070126.csv, calenviroscreen50_data_dictionary.pdf
  processed_path:
  - data/sf/processed/census_tracts.geojson
  script: scripts/process_datasets.py
  refresh: on OEHHA release
  limitations: Only pollution-burden indicators (PM2.5, diesel PM, ozone, traffic, toxic releases, housing
    lead risk, pollution burden percentile) are used. Percentiles are statewide, so SF sits in a narrow
    band for some (ozone). Neighbourhood values are population-weighted tract means. Never combined with
    population vulnerability into a single score.
  status: processed
commute_fixtures:
  source: Derived — Common Ground commute fixtures (GTFS schedule model + synthetic speed models)
  source_url: n/a (derived from gtfs_bart, gtfs_muni, gtfs_caltrain)
  licence: Inherits GTFS terms (SFMTA notice required)
  downloaded_at: '2026-10-21'
  measurement_period: Representative weekday AM peak 07:00-10:00 per feed
  resolution: H3 res-9 origin cells (~174 m) dissolved to polygons, simplified 20 m
  feature_count: 32
  raw_path: data/sf/raw/gtfs_*.zip
  processed_path:
  - data/sf/processed/commute_fixtures.geojson
  script: scripts/build_commute_fixtures.py
  refresh: after GTFS refresh
  limitations: 'Timetables not covering 2026-10-22: Muni (2026-08 timetable) — labelled in the UI. Transit:
    approximate, not timetable-exact; waits = half headway (cap 10 min); SamTrans absent; SFO uses an
    assumed 10 min AirTrain link from SFO BART. Walk/bike/drive are SYNTHETIC straight-line models and
    must be labelled as such in the UI.'
  status: processed
cycling_network:
  source: DataSF — MTA Bike Network Linear Features (SFMTA)
  source_url: https://data.sf.gov/d/ygmz-vaxd
  licence: ODC Public Domain Dedication and License (PDDL)
  downloaded_at: '2026-10-21'
  measurement_period: Network as of download date
  resolution: Street segment (block-level line geometry)
  feature_count: 5499
  raw_path: data/sf/raw/bike_network.geojson
  processed_path:
  - data/sf/processed/cycling_network.geojson
  script: scripts/process_datasets.py
  refresh: quarterly
  limitations: 'San Francisco only (no Peninsula facilities). One feature per direction where facilities
    differ, so km totals count each side. Category counts: lane 1733, neighborway 121, path 373, protected
    678, route 2594. grade_pct is a terrain estimate, not a surveyed street grade.'
  status: processed
elevation:
  source: USGS 3D Elevation Program (3DEP) seamless DEM via The National Map ImageServer
  source_url: https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer
  licence: US public domain (USGS) — credit 'U.S. Geological Survey'
  downloaded_at: '2026-10-21'
  measurement_period: Composite of 3DEP lidar collections
  resolution: 10 m bare-earth DEM resampled from 1 m lidar; summarised to H3 res-9 cells and street segments
  feature_count: 1117
  raw_path: data/sf/raw/elevation_3dep_10m.tif
  processed_path:
  - data/sf/processed/hills_grid.geojson
  - data/sf/processed/cycling_network.geojson (grade_pct)
  script: scripts/process_datasets.py
  refresh: rarely (terrain)
  limitations: 'Terrain slope, not street grade: a street cut across a hill can be flatter than the slope
    around it, and stairs/retaining walls are invisible. ''Steep'' = mean slope > 10%.'
  status: processed
food_drink_pois:
  source: OpenStreetMap contributors via Overpass API (amenity=cafe|restaurant|bar|pub, shop=coffee)
  source_url: https://overpass-api.de/api/interpreter
  licence: ODbL 1.0 — '© OpenStreetMap contributors'
  downloaded_at: '2026-10-21'
  measurement_period: OSM snapshot at download date
  resolution: Point (way/relation centroids)
  feature_count: 3245
  raw_path: data/sf/raw/osm_food_drink.json
  processed_path:
  - data/sf/processed/cafes.geojson
  - data/sf/processed/restaurants.geojson
  - data/sf/processed/bars.geojson
  script: scripts/process_datasets.py
  refresh: 6 months
  limitations: 'San Francisco only. Unnamed places dropped. Volunteer-mapped: openings/closures lag. cafes
    813, restaurants 1932, bars 500. Discovery context only — never a ranking input.'
  status: processed
groceries:
  source: OpenStreetMap contributors via Overpass API (shop=supermarket|greengrocer)
  source_url: https://overpass-api.de/api/interpreter
  licence: ODbL 1.0 — '© OpenStreetMap contributors'
  downloaded_at: '2026-10-21'
  measurement_period: OSM snapshot at download date
  resolution: Point (way/relation centroids)
  feature_count: 208
  raw_path: data/sf/raw/osm_groceries.json
  processed_path:
  - data/sf/processed/groceries.geojson
  script: scripts/process_datasets.py
  refresh: 6 months
  limitations: 'Volunteer-mapped: completeness varies; unnamed shops dropped. Access = straight-line 800
    m to a shop=supermarket.'
  status: processed
gtfs_bart:
  source: BART GTFS (bart.gov developer data)
  source_url: https://www.bart.gov/sites/default/files/2026-08/google_transit_20260810-20270108_v02.zip
  licence: BART Developer License Agreement (https://www.bart.gov/schedules/developers/developer-license-agreement)
    — revocable; no BART trademarks
  downloaded_at: '2026-10-21'
  measurement_period: Timetable valid 2026-08-10 to 2027-01-10; COVERS target 2026-10-22 (1021 trips)
  resolution: Stop/station points and route shapes
  feature_count: null
  raw_path: data/sf/raw/gtfs_bart.zip
  processed_path:
  - data/sf/processed/transit_stops.geojson
  - data/sf/processed/transit_routes.geojson
  script: scripts/process_datasets.py
  refresh: quarterly
  limitations: Scheduled, not real-time. No SamTrans (511 key required) — SFO buses (292/398/ECR) are
    absent.
  status: processed
  covers_target_date: true
gtfs_caltrain:
  source: Caltrain GTFS (Trillium-hosted official feed)
  source_url: https://data.trilliumtransit.com/gtfs/caltrain-ca-us/caltrain-ca-us.zip
  licence: Caltrain developer terms — unresolved; attribute Caltrain
  downloaded_at: '2026-10-21'
  measurement_period: Timetable valid 2026-01-31 to 2027-01-31; COVERS target 2026-10-22 (112 trips)
  resolution: Stop/station points and route shapes
  feature_count: null
  raw_path: data/sf/raw/gtfs_caltrain.zip
  processed_path:
  - data/sf/processed/transit_stops.geojson
  - data/sf/processed/transit_routes.geojson
  script: scripts/process_datasets.py
  refresh: quarterly
  limitations: Scheduled, not real-time. No SamTrans (511 key required) — SFO buses (292/398/ECR) are
    absent.
  status: processed
  covers_target_date: true
gtfs_muni:
  source: SFMTA Muni GTFS
  source_url: https://muni-gtfs.apps.sfmta.com/data/muni_gtfs-current.zip
  licence: SFMTA Transit Data License Agreement — derivative data must carry the notice 'Reproduced with
    permission granted by the City and County of San Francisco…'
  downloaded_at: '2026-10-21'
  measurement_period: Timetable valid 2026-07-23 to 2026-08-28; EXPIRED for target 2026-10-22 — fallback
    weekday 2026-08-26 used
  resolution: Stop/station points and route shapes
  feature_count: null
  raw_path: data/sf/raw/gtfs_muni.zip
  processed_path:
  - data/sf/processed/transit_stops.geojson
  - data/sf/processed/transit_routes.geojson
  script: scripts/process_datasets.py
  refresh: quarterly
  limitations: 'Timetable does not cover 2026-10-22: route geometry is reliable but departures and commute
    times reflect the 2026-07 schedule. SFMTA''s public ''current'' feed was not updated past this; a
    current Muni timetable needs the 511.org feed (API_511_KEY -> gtfs_muni_511). Scheduled, not real-time.
    No SamTrans (511 key required) — SFO buses (292/398/ECR) are absent.'
  status: processed
  covers_target_date: false
gtfs_muni_511:
  source: SFMTA Muni GTFS via 511.org Open Data
  source_url: https://api.511.org/transit/datafeeds?operator_id=SF
  licence: 511.org Open Data developer terms (token signup)
  downloaded_at: null
  measurement_period: null
  resolution: Stops and route shapes
  feature_count: null
  raw_path: null
  processed_path: []
  script: scripts/download_datasets.py
  refresh: n/a until unblocked
  limitations: 'SFMTA''s public ''current'' feed ended 2026-08-28; 511 carries the current timetable but
    returns HTTP 401 without a token. Add API_511_KEY to .env and rerun. Last attempt 2026-10-21: missing
    API_511_KEY in .env.'
  status: blocked
gtfs_samtrans:
  source: SamTrans GTFS via 511.org Open Data
  source_url: https://api.511.org/transit/datafeeds?operator_id=SM
  licence: 511.org Open Data terms — review
  downloaded_at: null
  measurement_period: null
  resolution: Stops and route shapes
  feature_count: null
  raw_path: null
  processed_path: []
  script: scripts/download_datasets.py
  refresh: n/a until unblocked
  limitations: '511.org returns HTTP 401 without a token. Add API_511_KEY to .env and rerun; processing
    picks the feed up automatically. Last attempt 2026-10-21: missing API_511_KEY in .env.'
  status: blocked
injury_collisions:
  source: DataSF — Traffic Crashes Resulting in Injury (SFPD/SFDPH TransBASE)
  source_url: https://data.sf.gov/d/ubvf-ztfx
  licence: ODC Public Domain Dedication and License (PDDL)
  downloaded_at: '2026-10-21'
  measurement_period: 2023-10-01 to 2026-10-01 (exclusive) (3 years)
  resolution: Crash points geocoded to intersection/segment; published as H3 res-8 cells and neighbourhood
    totals
  feature_count: 169
  raw_path: data/sf/raw/injury_crashes_3y.json
  processed_path:
  - data/sf/processed/collisions_grid.geojson
  script: scripts/process_datasets.py
  refresh: quarterly
  limitations: Injury crashes only (no property-damage-only). Recent months are incomplete due to reporting
    lag. Counts reflect traffic volume as much as danger.
  status: processed
neighbourhood_content:
  source: Common Ground editorial drafts (data/sf/content/neighbourhoods.yaml) + Wikimedia Commons photos
  source_url: https://commons.wikimedia.org
  licence: 'Text: project''s own. Photos: per-photo CC BY / CC BY-SA / CC0 / PD — attribution shown in
    UI'
  downloaded_at: '2026-10-21'
  measurement_period: n/a
  resolution: Neighbourhood (41)
  feature_count: 41
  raw_path: data/sf/content/neighbourhoods.yaml
  processed_path:
  - data/sf/processed/neighbourhood_content.json
  - public/images/neighbourhoods/
  script: scripts/build_content.py
  refresh: as needed
  limitations: 41/41 neighbourhoods have a photo; 41 cached locally (3717 KB, max 800 px). Descriptions
    are drafts and avoid demographic claims. Photos are mostly Wikipedia lead images (3 hand-picked);
    some show a landmark rather than streets.
  status: processed
neighbourhood_metrics:
  source: Derived — merge of the processed datasets above
  source_url: n/a (derived)
  licence: Inherits the most restrictive input (Zillow terms for the rents block)
  downloaded_at: '2026-10-21'
  measurement_period: Per input dataset
  resolution: Neighbourhood (41), computed from finer inputs
  feature_count: 41
  raw_path: n/a
  processed_path:
  - data/sf/processed/neighbourhood_metrics.json
  script: scripts/process_datasets.py
  refresh: after any input rebuild
  limitations: 'Coverage (neighbourhoods with data): crime 41/41, parks 41/41, cycling 41/41, transit
    41/41, hills 41/41, groceries 41/41, collisions 41/41, rents 41/41, population 41/41, environment
    41/41, food_drink 41/41'
  status: processed
neighbourhoods:
  source: DataSF — Analysis Neighborhoods (SF Planning)
  source_url: 'https://data.sf.gov/d/j2bu-swwd (map view: https://data.sf.gov/d/p5b7-5n3h)'
  licence: ODC Public Domain Dedication and License (PDDL)
  downloaded_at: '2026-10-21'
  measurement_period: Boundaries as published (last updated 2023-10)
  resolution: 41 neighbourhood polygons
  feature_count: 41
  raw_path: data/sf/raw/neighbourhoods.geojson
  processed_path:
  - data/sf/processed/neighbourhoods.geojson
  - data/sf/processed/neighbourhood_samples.json
  script: scripts/process_datasets.py
  refresh: yearly
  limitations: Planning analysis boundaries, not official or colloquial neighbourhood names. Geometry
    simplified at 5 m. `id` is a slug of the name and is the stable key used by every other dataset; renaming
    a neighbourhood changes it.
  status: processed
parks:
  source: DataSF — Recreation and Parks Properties (SF Rec & Park); supplemented by OpenStreetMap
  source_url: https://data.sf.gov/d/gtr9-ntp6 ; https://www.openstreetmap.org (Overpass API)
  licence: 'RPD: ODC PDDL. OSM supplement: ODbL 1.0 — attribution ''© OpenStreetMap contributors'' required'
  downloaded_at: '2026-10-21'
  measurement_period: Properties as of download date
  resolution: Park polygons; neighbourhood access shares from H3 res-9 sample points
  feature_count: 300
  raw_path: data/sf/raw/parks_rpd.geojson, data/sf/raw/osm_parks.json
  processed_path:
  - data/sf/processed/parks.geojson
  script: scripts/process_datasets.py
  refresh: yearly
  limitations: RPD covers only city-owned parks; federal (Presidio, GGNRA) and state land comes from OSM.
    59 non-RPD parks added from OpenStreetMap (ODbL), e.g. San Bruno Mountain State and County Park, Presidio
    of San Francisco, Fort Funston, Candlestick Point State Recreation Area, Lands End, Mount Sutro Open
    Space Reserve. Non-park RPD property types (libraries, concessions, Camp Mather, Sharp Park outside
    SF) are excluded. Access uses straight-line distance, not walking routes.
  status: processed
police_incidents:
  source: 'DataSF — Police Department Incident Reports: 2018 to Present (SFPD)'
  source_url: https://data.sf.gov/d/wg3w-h783
  licence: ODC Public Domain Dedication and License (PDDL)
  downloaded_at: '2026-10-21'
  measurement_period: '2025-10-01 to 2026-10-01 (exclusive): 12 complete months'
  resolution: Incident points anonymised to intersection/block; published as neighbourhood totals and
    H3 res-8 cells
  feature_count: 170
  raw_path: data/sf/raw/police_incidents_12m.json
  processed_path:
  - data/sf/processed/crime_by_neighbourhood.json
  - data/sf/processed/crime_grid.geojson
  script: scripts/process_datasets.py
  refresh: monthly
  limitations: 'Reported incidents only — not all crime is reported, and reporting rates differ by place
    and type. Per-km² rates are not per-resident: commercial and visitor areas (Downtown, Tenderloin,
    Financial District) have high daytime populations that inflate them. Drug offences largely reflect
    enforcement activity rather than resident risk. SFPD anonymises locations to the nearest intersection
    or block; points are not addresses. This describes reported incidents; it does not make any area safe
    or unsafe. 1708 incidents could not be placed in a neighbourhood.'
  status: processed
  incidents_counted: 49515
rents_zori:
  source: Zillow Research — ZORI (ZIP, all homes, smoothed, monthly); ZIP geography from Census 2020 ZCTAs
  source_url: https://www.zillow.com/research/data/ ; TIGERweb ZCTA 2020
  licence: 'Zillow Research data terms — free with attribution; REDISTRIBUTION OF DERIVED DATA UNRESOLVED,
    review https://www.zillow.com/research/data/ terms before public deployment. ZCTA: public domain.'
  downloaded_at: '2026-10-21'
  measurement_period: 2015-01 to 2026-09 monthly
  resolution: ZIP code (ZCTA approximation); NOT neighbourhood-specific
  feature_count: 34
  raw_path: data/sf/raw/zillow_zori_zip.csv, data/sf/raw/zcta_2020.geojson
  processed_path:
  - data/sf/processed/rents_zori_zip.json
  script: scripts/process_datasets.py
  refresh: monthly
  limitations: Asking rents for listed units, skewed toward units that turn over. ZIPs cross neighbourhood
    boundaries; the neighbourhood figure is a blend and must be labelled as ZIP-level. ZIPs with too few
    listings have no ZORI series.
  status: processed
transit:
  source: Combined BART + Muni + Caltrain static GTFS
  source_url: see gtfs_bart / gtfs_muni / gtfs_caltrain
  licence: Per-feed (see gtfs_* entries); SFMTA notice required on the map attribution
  downloaded_at: '2026-10-21'
  measurement_period: Representative weekday per feed
  resolution: Stops (rail rolled up to parent stations) and one representative shape per route
  feature_count: 3259
  raw_path: data/sf/raw/gtfs_*.zip
  processed_path:
  - data/sf/processed/transit_stops.geojson
  - data/sf/processed/transit_routes.geojson
  script: scripts/process_datasets.py
  refresh: quarterly
  limitations: 3259 stops, 80 routes inside the study area. weekday_departures counts all trips serving
    the stop on the representative day. 'Frequent' = >=120 weekday departures. SamTrans missing (511 key).
    Not a routing engine.
  status: processed
  route_count: 80
